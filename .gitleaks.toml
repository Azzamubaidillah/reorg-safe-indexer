[extend]
useDefault = true

# Ethereum contract addresses (USDC, USDT, the Uniswap pool) are public identifiers, not
# credentials, but their 40 hex characters trip the generic-api-key rule.
[allowlist]
description = "public 20-byte Ethereum addresses"
regexes = ['''^0x[0-9a-fA-F]{40}$''']
paths = ['''(^|/)\.next/''']
